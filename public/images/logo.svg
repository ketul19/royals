<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="currentColor" aria-label="Royal's Inn crest logo">
  <!-- ═══════════════════════════════════════════════
       CROWN — 5 points, centered above shield
  ════════════════════════════════════════════════ -->
  <g id="crown">
    <!-- Crown base band -->
    <rect x="72" y="52" width="56" height="8" rx="1"/>
    <!-- Crown points: centre tall, two medium, two short outer -->
    <polygon points="100,28 104,52 96,52"/>
    <polygon points="86,34 89,52 83,52"/>
    <polygon points="114,34 117,52 111,52"/>
    <polygon points="74,40 76,52 72,52"/>
    <polygon points="126,40 128,52 124,52"/>
    <!-- Crown jewels — small circles on points -->
    <circle cx="100" cy="27" r="3"/>
    <circle cx="86"  cy="33" r="2.2"/>
    <circle cx="114" cy="33" r="2.2"/>
    <circle cx="74"  cy="39" r="1.8"/>
    <circle cx="126" cy="39" r="1.8"/>
    <!-- Crown base decorative dots -->
    <circle cx="80"  cy="56" r="1.4"/>
    <circle cx="90"  cy="56" r="1.4"/>
    <circle cx="100" cy="56" r="1.4"/>
    <circle cx="110" cy="56" r="1.4"/>
    <circle cx="120" cy="56" r="1.4"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       SHIELD — pointed bottom, classic heraldic shape
  ════════════════════════════════════════════════ -->
  <g id="shield">
    <!-- Outer shield outline -->
    <path d="M65,58 L65,120 Q65,138 100,158 Q135,138 135,120 L135,58 Z"
          fill-rule="evenodd"/>
    <!-- Inner shield field (cut-out so R shows on bg) -->
    <path d="M65,58 L65,120 Q65,138 100,158 Q135,138 135,120 L135,58 Z
             M69,62 L69,119 Q69,135 100,153 Q131,135 131,119 L131,62 Z"
          fill-rule="evenodd"/>
    <!-- Shield inner border accent lines -->
    <path d="M72,65 L72,118 Q72,132 100,149 Q128,132 128,118 L128,65 Z"
          fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       LETTER R — centred inside shield
  ════════════════════════════════════════════════ -->
  <text
    x="100"
    y="126"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="bold"
    letter-spacing="-1"
    fill="currentColor">R</text>

  <!-- ═══════════════════════════════════════════════
       LEFT RAMPANT LION — facing right (inward)
       Front paws raised, tail curved up
  ════════════════════════════════════════════════ -->
  <g id="lion-left" transform="translate(14,62)">
    <!-- Body -->
    <ellipse cx="26" cy="72" rx="10" ry="16" transform="rotate(-15,26,72)"/>
    <!-- Head -->
    <circle cx="36" cy="50" r="9"/>
    <!-- Mane rough ring -->
    <circle cx="36" cy="50" r="12" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <!-- Snout -->
    <ellipse cx="42" cy="53" rx="4" ry="3"/>
    <!-- Eye -->
    <circle cx="38" cy="47" r="1.5" fill="currentColor"/>
    <!-- Ear -->
    <polygon points="30,42 27,35 34,40"/>
    <!-- Raised front left paw (upper) -->
    <path d="M32,60 Q20,52 16,42 Q18,38 22,40 Q24,44 26,48 Q28,52 30,56"/>
    <circle cx="16" cy="40" r="3.5"/>
    <!-- Raised front right paw (middle height) -->
    <path d="M36,64 Q26,58 24,50 Q26,46 30,48 Q32,52 33,56 Q34,60 35,63"/>
    <circle cx="24" cy="48" r="3"/>
    <!-- Hind leg grounded left -->
    <path d="M20,84 Q18,92 16,98 Q20,100 24,98 Q24,92 24,86"/>
    <!-- Hind leg grounded right -->
    <path d="M28,86 Q28,94 30,100 Q34,100 36,98 Q34,92 32,86"/>
    <!-- Tail — curves up and over -->
    <path d="M18,78 Q6,72 4,58 Q4,46 12,44 Q16,50 14,56 Q12,64 18,70"
          fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <circle cx="12" cy="43" r="4"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       RIGHT RAMPANT LION — mirror of left, facing left (inward)
  ════════════════════════════════════════════════ -->
  <g id="lion-right" transform="translate(186,62) scale(-1,1)">
    <!-- Body -->
    <ellipse cx="26" cy="72" rx="10" ry="16" transform="rotate(-15,26,72)"/>
    <!-- Head -->
    <circle cx="36" cy="50" r="9"/>
    <!-- Mane rough ring -->
    <circle cx="36" cy="50" r="12" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <!-- Snout -->
    <ellipse cx="42" cy="53" rx="4" ry="3"/>
    <!-- Eye -->
    <circle cx="38" cy="47" r="1.5" fill="currentColor"/>
    <!-- Ear -->
    <polygon points="30,42 27,35 34,40"/>
    <!-- Raised front left paw (upper) -->
    <path d="M32,60 Q20,52 16,42 Q18,38 22,40 Q24,44 26,48 Q28,52 30,56"/>
    <circle cx="16" cy="40" r="3.5"/>
    <!-- Raised front right paw (middle height) -->
    <path d="M36,64 Q26,58 24,50 Q26,46 30,48 Q32,52 33,56 Q34,60 35,63"/>
    <circle cx="24" cy="48" r="3"/>
    <!-- Hind leg grounded left -->
    <path d="M20,84 Q18,92 16,98 Q20,100 24,98 Q24,92 24,86"/>
    <!-- Hind leg grounded right -->
    <path d="M28,86 Q28,94 30,100 Q34,100 36,98 Q34,92 32,86"/>
    <!-- Tail — curves up and over -->
    <path d="M18,78 Q6,72 4,58 Q4,46 12,44 Q16,50 14,56 Q12,64 18,70"
          fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <circle cx="12" cy="43" r="4"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       ORNAMENTAL SCROLLWORK / FLOURISHES — below shield
  ════════════════════════════════════════════════ -->
  <g id="scrollwork">
    <!-- Centre horizontal divider line -->
    <line x1="55" y1="168" x2="145" y2="168" stroke="currentColor" stroke-width="1"/>

    <!-- Left scroll spiral -->
    <path d="M100,168 Q82,168 74,176 Q68,182 72,190 Q76,196 84,192 Q90,188 88,182 Q86,178 80,178 Q76,180 78,184"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- Left outer leaf -->
    <path d="M56,168 Q62,160 70,164 Q66,170 60,170 Z"/>
    <!-- Left inner leaf -->
    <path d="M72,168 Q76,162 82,165 Q79,170 74,170 Z"/>

    <!-- Right scroll spiral (mirror) -->
    <path d="M100,168 Q118,168 126,176 Q132,182 128,190 Q124,196 116,192 Q110,188 112,182 Q114,178 120,178 Q124,180 122,184"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- Right outer leaf -->
    <path d="M144,168 Q138,160 130,164 Q134,170 140,170 Z"/>
    <!-- Right inner leaf -->
    <path d="M128,168 Q124,162 118,165 Q121,170 126,170 Z"/>

    <!-- Centre diamond accent -->
    <polygon points="100,162 103,168 100,174 97,168"/>

    <!-- Tagline banner base -->
    <path d="M60,185 Q100,195 140,185" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  </g>
</svg>
