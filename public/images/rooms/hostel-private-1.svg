  </pattern>
  <rect width="800" height="500" fill="url(#p)"/>
  <!-- Crown icon -->
  <text x="400" y="220" text-anchor="middle" font-size="48" fill="#c9a84c" opacity="0.4">♛</text>
  <!-- Label -->
  <text x="400" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c9a84c" opacity="0.7">hostel private 1</text>
  <text x="400" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8a8279">Royal's Inn — Placeholder Image</text>
</svg>