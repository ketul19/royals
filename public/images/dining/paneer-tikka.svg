<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#1a1a1a"/>
  <rect x="1" y="1" width="598" height="598" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.3"/>
  <!-- Diagonal lines pattern -->
  <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#c9a84c" stroke-width="0.5" opacity="0.08"/>
  </pattern>
  <rect width="600" height="600" fill="url(#p)"/>
  <!-- Crown icon -->
  <text x="300" y="270" text-anchor="middle" font-size="48" fill="#c9a84c" opacity="0.4">♛</text>
  <!-- Label -->
  <text x="300" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c9a84c" opacity="0.7">paneer tikka</text>
  <text x="300" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8a8279">Royal's Inn — Placeholder Image</text>
</svg>